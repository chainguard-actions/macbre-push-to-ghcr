name: Test push to docker.io with docker_io_user and docker_io_token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal Dockerfile for the test
      - name: Create test Dockerfile
        run: |
          cat > "$GITHUB_WORKSPACE/tests/Dockerfile.test" <<'EOF'
          FROM alpine:latest
          ARG BUILD_DATE
          ARG GITHUB_SHA
          ENV GITHUB_SHA=$GITHUB_SHA
          RUN echo "test image built"
          EOF

      # The action will attempt to login to docker.io with the provided credentials.
      # With a fake token, the docker.io login/push will fail, but the action should
      # still run and fail gracefully (not panic or produce unexpected output).
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          image_name: ${{ github.repository_owner }}/push-to-ghcr-test
          dockerfile: ./tests/Dockerfile.test
          context: .
          repository: ghcr.io
          image_tag: "latest"
          docker_io_user: "fake-docker-user"
          docker_io_token: "fake-docker-token"

      - name: Assert action ran (build succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (image built and pushed)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness - push to ghcr.io/docker.io may not be authorized)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
