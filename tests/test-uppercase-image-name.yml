name: Test image name is lowercased automatically
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Docker daemon to allow insecure local registry
        run: |
          sudo mkdir -p /etc/docker
          echo '{"insecure-registries":["localhost:5000"]}' | sudo tee /etc/docker/daemon.json
          if sudo systemctl restart docker 2>/dev/null; then
            echo "Restarted docker via systemctl"
          else
            sudo pkill dockerd || true
            sleep 2
            sudo dockerd --insecure-registry localhost:5000 &>/tmp/dockerd.log &
            sleep 5
          fi
          for i in $(seq 1 15); do
            if docker info > /dev/null 2>&1; then
              echo "Docker is ready"
              break
            fi
            echo "Waiting for Docker... ($i)"
            sleep 2
          done
          docker info 2>&1 | grep -A5 "Insecure Registries" || true

      - name: Start local Docker registry
        run: |
          docker run -d -p 5000:5000 --name local-registry registry:2
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/v2/ > /dev/null 2>&1; then
              echo "Registry is ready"
              break
            fi
            echo "Waiting for registry... ($i)"
            sleep 2
          done

      - name: Run push-to-ghcr action with uppercase image name
        id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Use uppercase letters in the image name - action should lowercase it
          image_name: TestOwner/TEST-UPPERCASE-IMAGE
          dockerfile: tests/fixtures/Dockerfile
          context: tests/fixtures
          repository: localhost:5000
          image_tag: "lowercase-test"

      - name: Assert image was pushed with lowercased name
        run: |
          # The action lowercases the image name, so TEST-UPPERCASE-IMAGE becomes test-uppercase-image
          IMAGE="localhost:5000/testowner/test-uppercase-image:lowercase-test"
          echo "Pulling image: $IMAGE"
          if docker pull "$IMAGE"; then
            echo "PASS: image with lowercased name successfully pulled from local registry"
          else
            echo "FAIL: could not pull image with lowercased name from local registry"
            exit 1
          fi

      - name: Cleanup local registry
        if: always()
        run: docker rm -f local-registry || true
