name: Test push with docker.io credentials (docker_io_user and docker_io_token)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
        with:
          github_token: fake-token-for-testing
          image_name: test-user/test-repo
          image_tag: latest
          dockerfile: ./Dockerfile
          context: .
          docker_io_user: fake-docker-user
          docker_io_token: fake-docker-token

      - name: Assert action failed at login (not at tag validation or input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at docker login (fake token), not at tag validation.
          # This confirms the action correctly accepted docker_io_user and docker_io_token
          # inputs and proceeded past the tag-setting logic to the login step.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (fake token used)"
            exit 1
          fi
          echo "PASS: action failed as expected (at docker login with fake credentials)"
