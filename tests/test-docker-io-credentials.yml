name: Test docker_io_token and docker_io_user inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: invalid-fake-token-for-testing
          image_name: testuser/testrepo
          dockerfile: ${{ github.workspace }}/actions/hardened/macbre--push-to-ghcr/v17/Dockerfile
          context: ${{ github.workspace }}/actions/hardened/macbre--push-to-ghcr/v17
          image_tag: latest
          docker_io_token: fake-docker-io-token
          docker_io_user: fake-docker-io-user

      - name: Assert action failed at docker login (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at docker login ghcr.io (bad github_token),
          # confirming docker_io_token and docker_io_user inputs are accepted.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at docker login with bad token)"
            exit 1
          fi
          echo "PASS: action accepted docker_io_token and docker_io_user inputs and proceeded to docker login"
