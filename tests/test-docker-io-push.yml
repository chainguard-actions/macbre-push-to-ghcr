name: Test docker.io push inputs (docker_io_user and docker_io_token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          image_name: test-user/test-image
          dockerfile: ./Dockerfile
          context: .
          repository: ghcr.io
          docker_io_user: fake-docker-user
          docker_io_token: fake-docker-token

      - name: Assert action failed due to invalid token (not due to missing inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials (docker_io_user and docker_io_token inputs exercised)"
