name: Test push with docker_io_token and docker_io_user inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Docker daemon to allow insecure local registries
        run: |
          sudo mkdir -p /etc/docker
          echo '{"insecure-registries":["localhost:5000","localhost:5001"]}' | sudo tee /etc/docker/daemon.json
          if sudo systemctl restart docker 2>/dev/null; then
            echo "Restarted docker via systemctl"
          else
            sudo pkill dockerd || true
            sleep 2
            sudo dockerd --insecure-registry localhost:5000 --insecure-registry localhost:5001 &>/tmp/dockerd.log &
            sleep 5
          fi
          for i in $(seq 1 15); do
            if docker info > /dev/null 2>&1; then
              echo "Docker is ready"
              break
            fi
            echo "Waiting for Docker... ($i)"
            sleep 2
          done
          docker info 2>&1 | grep -A5 "Insecure Registries" || true

      - name: Start local Docker registries (main + docker.io mock)
        run: |
          # Main registry on port 5000 (used as the primary repository)
          docker run -d -p 5000:5000 --name local-registry registry:2
          # Mock docker.io registry on port 5001
          docker run -d -p 5001:5000 --name mock-docker-io registry:2
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/v2/ > /dev/null 2>&1 && \
               curl -sf http://localhost:5001/v2/ > /dev/null 2>&1; then
              echo "Both registries are ready"
              break
            fi
            echo "Waiting for registries... ($i)"
            sleep 2
          done

      - name: Redirect docker.io to local mock registry via wrapper
        run: |
          # Create a docker wrapper that rewrites docker.io references to localhost:5001
          # and intercepts docker login docker.io to succeed without real credentials
          sudo tee /usr/local/bin/docker-wrapper.sh > /dev/null << 'WRAPPER'
          #!/bin/bash
          # Rewrite docker.io login to use localhost:5001 (no auth needed)
          ARGS=("$@")
          NEW_ARGS=()
          skip_next=0
          for i in "${!ARGS[@]}"; do
            if [ "$skip_next" = "1" ]; then
              skip_next=0
              continue
            fi
            arg="${ARGS[$i]}"
            # Rewrite docker.io references to localhost:5001
            arg="${arg//docker.io/localhost:5001}"
            NEW_ARGS+=("$arg")
          done
          exec /usr/bin/docker "${NEW_ARGS[@]}"
          WRAPPER
          sudo chmod +x /usr/local/bin/docker-wrapper.sh

          # Override docker command with wrapper
          sudo tee /usr/local/bin/docker > /dev/null << 'DOCKERWRAP'
          #!/bin/bash
          # Intercept docker login docker.io to succeed without real credentials
          if [ "$1" = "login" ] && [ "$2" = "docker.io" ]; then
            echo "Login Succeeded (mock docker.io)"
            exit 0
          fi
          # Rewrite docker.io image references to localhost:5001
          ARGS=()
          for arg in "$@"; do
            ARGS+=("${arg//docker.io/localhost:5001}")
          done
          exec /usr/bin/docker "${ARGS[@]}"
          DOCKERWRAP
          sudo chmod +x /usr/local/bin/docker
          # Verify wrapper is in place
          which docker
          docker --version

      - name: Run push-to-ghcr action with docker_io_token and docker_io_user
        id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          image_name: testowner/test-docker-io-push
          dockerfile: tests/fixtures/Dockerfile
          context: tests/fixtures
          repository: localhost:5000
          image_tag: "1.0.0"
          docker_io_token: "mock-token-for-coverage"
          docker_io_user: "mock-docker-user"

      - name: Assert image was pushed to main registry
        run: |
          echo "Verifying the image exists in main local registry with tag 1.0.0..."
          IMAGE="localhost:5000/testowner/test-docker-io-push:1.0.0"
          echo "Pulling image: $IMAGE"
          if /usr/bin/docker pull "$IMAGE"; then
            echo "PASS: image successfully pulled from main local registry"
          else
            echo "FAIL: could not pull image from main local registry"
            exit 1
          fi

      - name: Assert image was pushed to mock docker.io registry
        run: |
          echo "Verifying the image exists in mock docker.io registry (localhost:5001)..."
          IMAGE="localhost:5001/testowner/test-docker-io-push:1.0.0"
          echo "Pulling image: $IMAGE"
          if /usr/bin/docker pull "$IMAGE"; then
            echo "PASS: image successfully pulled from mock docker.io registry"
          else
            echo "FAIL: could not pull image from mock docker.io registry"
            exit 1
          fi

      - name: Cleanup local registries
        if: always()
        run: |
          docker rm -f local-registry mock-docker-io || true
