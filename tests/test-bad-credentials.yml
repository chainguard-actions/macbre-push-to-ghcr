name: Test action fails with bad credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: invalid-fake-token-for-testing
          image_name: testuser/testrepo
          dockerfile: ${{ github.workspace }}/pristine/macbre--push-to-ghcr/v17/Dockerfile
          context: ${{ github.workspace }}/pristine/macbre--push-to-ghcr/v17
          image_tag: latest

      - name: Assert action failed due to bad credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid github_token"
            exit 1
          fi
          echo "PASS: action correctly failed with bad credentials"
