name: Test push with docker_io_token and docker_io_user inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Docker daemon to allow insecure local registry
        run: |
          sudo mkdir -p /etc/docker
          echo '{"insecure-registries":["localhost:5000"]}' | sudo tee /etc/docker/daemon.json
          if sudo systemctl restart docker 2>/dev/null; then
            echo "Restarted docker via systemctl"
          else
            sudo pkill dockerd || true
            sleep 2
            sudo dockerd --insecure-registry localhost:5000 &>/tmp/dockerd.log &
            sleep 5
          fi
          for i in $(seq 1 15); do
            if docker info > /dev/null 2>&1; then
              echo "Docker is ready"
              break
            fi
            echo "Waiting for Docker... ($i)"
            sleep 2
          done
          docker info 2>&1 | grep -A5 "Insecure Registries" || true

      - name: Start local Docker registry
        run: |
          docker run -d -p 5000:5000 --name local-registry registry:2
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/v2/ > /dev/null 2>&1; then
              echo "Registry is ready"
              break
            fi
            echo "Waiting for registry... ($i)"
            sleep 2
          done

      - name: Run push-to-ghcr action with docker_io_token and docker_io_user inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          image_name: testowner/test-push-to-ghcr
          dockerfile: tests/fixtures/Dockerfile
          context: tests/fixtures
          repository: localhost:5000
          image_tag: "latest"
          docker_io_token: "fake-docker-io-token-for-testing"
          docker_io_user: "fake-docker-io-user"

      - name: Assert action ran and covered docker_io_token and docker_io_user inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will attempt to push to docker.io with a fake token and fail.
          # Either outcome (success or failure) is acceptable here — what matters is
          # that the docker_io_token and docker_io_user inputs were exercised.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (docker.io push may have been skipped or succeeded)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — fake docker.io token cannot authenticate)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Cleanup local registry
        if: always()
        run: docker rm -f local-registry || true
