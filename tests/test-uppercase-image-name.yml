name: Test uppercase image_name is accepted (lowercased internally)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: invalid-fake-token-for-testing
          image_name: TestUser/TestRepo
          dockerfile: ${{ github.workspace }}/pristine/macbre--push-to-ghcr/v17/Dockerfile
          context: ${{ github.workspace }}/pristine/macbre--push-to-ghcr/v17
          image_tag: latest

      - name: Assert action failed at docker login (not at image_name validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at docker login (bad token), not before.
          # This confirms uppercase image_name is accepted and lowercased internally.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at docker login with bad token)"
            exit 1
          fi
          echo "PASS: action accepted uppercase image_name and proceeded to docker login"
