name: Test uppercase image name is lowercased
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          image_name: TEST-USER/MY-UPPERCASE-IMAGE
          dockerfile: ./Dockerfile
          context: .
          repository: ghcr.io

      - name: Assert action failed due to invalid token (not due to uppercase image name)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly handled uppercase image name (lowercasing applied) and failed at auth step"
