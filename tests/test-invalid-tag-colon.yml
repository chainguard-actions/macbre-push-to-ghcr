name: Test invalid image_tag input (tag with colon)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
        with:
          github_token: fake-token-for-testing
          image_name: test-user/test-repo
          image_tag: "latest:extra"
          dockerfile: ./Dockerfile
          context: .

      - name: Assert action failed due to invalid tag with colon
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid tag containing ':'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid tag containing ':'"
