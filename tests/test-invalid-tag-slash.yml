name: Test invalid image_tag with slash fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile for test
        run: |
          echo "FROM scratch" > /tmp/test-dockerfile

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token
          image_name: testuser/testrepo
          dockerfile: /tmp/test-dockerfile
          image_tag: "ghcr.io/testuser/testrepo:latest"

      - name: Assert action failed due to invalid tag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid image_tag containing '/'"
            exit 1
          fi
          echo "PASS: action correctly failed when image_tag contained '/'"
