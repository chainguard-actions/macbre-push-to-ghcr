name: Test invalid image tag (with slash) causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run push-to-ghcr action with invalid tag containing a slash
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          image_name: testowner/test-push-to-ghcr
          dockerfile: tests/fixtures/Dockerfile
          context: tests/fixtures
          repository: localhost:5000
          image_tag: "invalid/tag"

      - name: Assert action failed due to invalid tag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid tag containing slash, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid tag with a slash"
