name: Test custom dockerfile path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a custom Dockerfile in a subdirectory
        run: |
          mkdir -p docker
          cat > docker/Dockerfile.custom <<'EOF'
          FROM alpine:latest
          ARG BUILD_DATE
          ARG GITHUB_SHA
          ENV GITHUB_SHA=$GITHUB_SHA
          RUN echo "Custom Dockerfile"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          image_name: test-user/custom-dockerfile-image
          dockerfile: ./docker/Dockerfile.custom
          context: .
          repository: ghcr.io
          image_tag: custom-tag

      - name: Assert action failed due to invalid token (custom dockerfile path exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly exercised custom dockerfile path and failed at auth step"
